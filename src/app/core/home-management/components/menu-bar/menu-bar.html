<p-menubar [model]="items">
    <ng-template #start>
        <span class="pi pi-home"> Zarządzanie domem</span>
    </ng-template>
    <ng-template #item let-item let-root="root">
        <a pRipple class="flex items-center p-menubar-item-link">
            @if (item.icon) {
                <i [ngClass]="['ml-auto pi', item.icon]"></i>
            }
            <span>{{ item.label }}</span>
            @if (item.badge) {
                <p-badge [ngClass]="{ 'ml-auto': !root, 'ml-2': root }" [value]="item.badge" />
            }
            @if (item.shortcut) {
                <span class="ml-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1">{{ item.shortcut }}</span>
            }
            @if (item.items) {
                <i [ngClass]="['ml-auto pi', root ? 'pi-angle-down' : 'pi-angle-right']"></i>
            }
        </a>
    </ng-template>
    <ng-template #end>
        <div class="flex items-center gap-2">
            <button pButton severity="danger" (click)="onLogoutClick()">
                <i class="pi pi-sign-out" pButtonIcon></i>
                <span pButtonLabel>Wyloguj</span>
            </button>
        </div>
    </ng-template>
</p-menubar>
