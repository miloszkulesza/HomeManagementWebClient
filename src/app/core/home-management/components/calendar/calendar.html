<div class="p-d-flex p-jc-center p-mt-4">
  <p-card styleClass="calendar-card">

    <!-- Nagłówek miesięcy w jednej linii i wyśrodkowany -->
    <div class="header-row p-d-flex p-ai-center p-jc-center p-gap-3 p-mb-4">
      <p-button icon="pi pi-angle-left" (click)="prevMonth()" styleClass="p-button-text"></p-button>
      <h2 class="p-m-0 title">Kalendarz</h2>
      <p-button icon="pi pi-angle-right" (click)="nextMonth()" styleClass="p-button-text"></p-button>
    </div>

    <!-- Dwa miesiące responsywnie -->
    <div class="months-wrapper p-d-flex p-flex-wrap p-gap-4">

      <!-- LEWY MIESIĄC -->
      <div class="month-wrapper p-flex-1 p-min-w-300px">
        <h3 class="p-text-center">{{ leftMonth.label }}</h3>

        <!-- Nagłówek dni tygodnia -->
        <div class="p-grid weekday-header">
          <div class="p-col p-text-center" *ngFor="let d of weekdays">{{ d }}</div>
        </div>

        <!-- Tygodnie -->
        <div *ngFor="let week of leftMonth.weeks">
          <div class="p-grid week-row">
            <div class="p-col day-cell" *ngFor="let day of week" [ngClass]="{'other-month': !isCurrentMonth(leftMonth, day)}">
              <div class="day-number">{{ day.getDate() }}</div>
              <div class="events">
                <div class="event" *ngFor="let e of getEventsForDay(day)" [style.background]="e.color">{{ e.title }}</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- PRAWY MIESIĄC -->
      <div class="month-wrapper p-flex-1 p-min-w-300px">
        <h3 class="p-text-center">{{ rightMonth.label }}</h3>

        <div class="p-grid weekday-header">
          <div class="p-col p-text-center" *ngFor="let d of weekdays">{{ d }}</div>
        </div>

        <div *ngFor="let week of rightMonth.weeks">
          <div class="p-grid week-row">
            <div class="p-col day-cell" *ngFor="let day of week" [ngClass]="{'other-month': !isCurrentMonth(rightMonth, day)}">
              <div class="day-number">{{ day.getDate() }}</div>
              <div class="events">
                <div class="event" *ngFor="let e of getEventsForDay(day)" [style.background]="e.color">{{ e.title }}</div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </p-card>
</div>
